<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pahadi Rides Offline</title>
    <style>
      :root {
        --brand: #0f6e56;
        --brand-light: #e1f5ee;
        --surface: #ffffff;
        --surface-raised: #fafaf9;
        --text-primary: #1c1917;
        --text-secondary: #78716c;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--surface-raised);
        color: var(--text-primary);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100% - 40px, 440px);
        border-radius: 24px;
        background: var(--surface);
        padding: 28px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
      }
      svg {
        width: 100%;
        height: auto;
      }
      h1 {
        margin: 20px 0 8px;
        color: var(--brand);
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        margin: 0;
        color: var(--text-secondary);
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        border-radius: 12px;
        background: var(--brand);
        color: white;
        font-weight: 700;
        padding: 0 18px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 320 160" aria-hidden="true">
        <rect width="320" height="160" rx="24" fill="#E1F5EE" />
        <path d="M20 120L86 46L132 92L186 28L300 120H20Z" fill="#fff" />
        <path d="M116 160C132 124 154 95 182 72C205 98 228 128 244 160H116Z" fill="#0F6E56" />
      </svg>
      <h1>Pahadi Rides</h1>
      <p>You're offline. Check your connection to continue booking.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
