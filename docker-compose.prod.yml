# MoveOS production stack — single-VPS deployment.
#
#   cp .env.production.example .env.production   # fill in secrets/providers
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml exec api-gateway npx prisma migrate deploy
#
# nginx is the only public entrypoint (port 80/443):
#   /            → PWA (passenger + driver app)
#   /admin/      → admin portal (static)
#   /api/, /ws/  → api-gateway
#
# ride-service is intentionally NOT deployed — the on-demand ride flow is
# parked (see moveos_backend/apps/ride-service/README.md).

x-backend-service: &backend-service
  build:
    context: ./moveos_backend
    dockerfile: Dockerfile
  image: moveos-backend:latest
  restart: unless-stopped
  networks: [moveos]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-moveos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moveos}
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    # External providers (dev = log-only; set real providers before launch)
    SMS_PROVIDER: ${SMS_PROVIDER:-dev}
    MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
    MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
    MSG91_FLOW_TEMPLATE_ID: ${MSG91_FLOW_TEMPLATE_ID:-}
    MSG91_SENDER_ID: ${MSG91_SENDER_ID:-PAHADI}
    PUSH_PROVIDER: ${PUSH_PROVIDER:-dev}
    FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
    FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
    FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
    KYC_PROVIDER: ${KYC_PROVIDER:-dev}
    HYPERVERGE_APP_ID: ${HYPERVERGE_APP_ID:-}
    HYPERVERGE_APP_KEY: ${HYPERVERGE_APP_KEY:-}
    HYPERVERGE_BASE_URL: ${HYPERVERGE_BASE_URL:-https://ind.idv.hyperverge.co/v1}
    PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-dev}
    RAZORPAYX_KEY_ID: ${RAZORPAYX_KEY_ID:-}
    RAZORPAYX_KEY_SECRET: ${RAZORPAYX_KEY_SECRET:-}
    RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:-}
    ALLOW_DEV_PROVIDERS_IN_PRODUCTION: ${ALLOW_DEV_PROVIDERS_IN_PRODUCTION:-}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks: [moveos]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moveos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-moveos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moveos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [moveos]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    <<: *backend-service
    environment:
      <<: *backend-env
      SERVICE_NAME: api-gateway
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to your public origins}
      RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-300}
      RATE_LIMIT_OTP_PER_MINUTE: ${RATE_LIMIT_OTP_PER_MINUTE:-10}
      DRIVER_SERVICE_URL: http://driver-service:3001/api
      RIDE_SERVICE_URL: http://driver-service:3001/api # parked flow — unused
      DISPATCH_SERVICE_URL: http://dispatch-service:3003/api
      TELEMETRY_SERVICE_URL: http://telemetry-service:3004/api
      NOTIFICATION_SERVICE_URL: http://notification-service:3005/api
      ONBOARDING_SERVICE_URL: http://onboarding-service:3006/api
      LOCATION_SERVICE_URL: http://location-service:3007/api
      SCHEDULING_SERVICE_URL: http://scheduling-service:3008/api
      BOOKING_SERVICE_URL: http://booking-service:3009/api
    volumes:
      - uploads_data:/app/uploads

  onboarding-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SERVICE_NAME: onboarding-service
      PORT: 3006

  driver-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SERVICE_NAME: driver-service
      PORT: 3001
    volumes:
      - uploads_data:/app/uploads

  scheduling-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SERVICE_NAME: scheduling-service
      PORT: 3008
      CLUSTER_INTERVAL_MINUTES: ${CLUSTER_INTERVAL_MINUTES:-30}
      CLUSTER_EPS_KM: ${CLUSTER_EPS_KM:-15}
      CLUSTER_MIN_PASSENGERS: ${CLUSTER_MIN_PASSENGERS:-3}

  booking-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SERVICE_NAME: booking-service
      PORT: 3009
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET}
      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-10}
      CANCELLATION_FREE_HOURS: ${CANCELLATION_FREE_HOURS:-12}
      CANCELLATION_PARTIAL_HOURS: ${CANCELLATION_PARTIAL_HOURS:-2}
      CANCELLATION_PARTIAL_PERCENT: ${CANCELLATION_PARTIAL_PERCENT:-50}

  location-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SERVICE_NAME: location-service
      PORT: 3007
      OLA_MAPS_API_KEY: ${OLA_MAPS_API_KEY:?set OLA_MAPS_API_KEY}
      OLA_MAPS_BASE_URL: ${OLA_MAPS_BASE_URL:-https://api.olamaps.io}
      LOCATION_CACHE_TTL_SECONDS: ${LOCATION_CACHE_TTL_SECONDS:-300}

  telemetry-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SERVICE_NAME: telemetry-service
      PORT: 3004

  notification-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SERVICE_NAME: notification-service
      PORT: 3005

  dispatch-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SERVICE_NAME: dispatch-service
      PORT: 3003

  pwa:
    build:
      context: ./moveos-pwa
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?set PUBLIC_URL}/api
        NEXT_PUBLIC_WS_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${FIREBASE_WEB_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${FIREBASE_WEB_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FCM_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_WEB_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${FIREBASE_WEB_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${FIREBASE_WEB_VAPID_KEY:-}
    restart: unless-stopped
    networks: [moveos]
    environment:
      PORT: 3020

  admin:
    build:
      context: ./moveos-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}/api
        NEXT_PUBLIC_WS_URL: ${PUBLIC_URL}
    restart: unless-stopped
    networks: [moveos]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [moveos]
    depends_on:
      - api-gateway
      - pwa
      - admin
    ports:
      - "80:80"
      # For TLS, terminate here with your certs:
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro

networks:
  moveos:

volumes:
  postgres_data:
  redis_data:
  uploads_data:
