# MoveOS reverse proxy — the single public entrypoint.
#   /        → PWA (Next.js server)
#   /admin/  → admin portal (static export)
#   /api/    → api-gateway REST
#   /ws/     → api-gateway Socket.IO (websocket upgrade)
#   /docs    → gateway Swagger (consider disabling in production)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  # ── API gateway ──────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://api-gateway:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # ── Socket.IO (live tracking, manifest updates) ──────────────────────────
  location /ws/ {
    proxy_pass http://api-gateway:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  location /socket.io/ {
    proxy_pass http://api-gateway:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # ── Swagger docs ─────────────────────────────────────────────────────────
  location /docs {
    proxy_pass http://api-gateway:3000;
    proxy_set_header Host $host;
  }

  # ── Admin portal (static) ────────────────────────────────────────────────
  location /admin/ {
    proxy_pass http://admin:80/;
    proxy_set_header Host $host;
  }

  # ── PWA (default) ────────────────────────────────────────────────────────
  location / {
    proxy_pass http://pwa:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
